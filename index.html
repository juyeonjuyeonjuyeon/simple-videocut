<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: simplecut-media:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="referrer" content="no-referrer" />
    <title>SimpleCut — 나만의 영상 편집기</title>
    <script vite-ignore src="./theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%app-icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171A1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SimpleCut" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cute+Font&family=Do+Hyeon&family=Dokdo&family=Gaegu&family=Gamja+Flower&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Gugi&family=Hi+Melody&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Poor+Story&family=Single+Day&family=Song+Myung&family=Stylish&family=Sunflower:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <img class="splash__logo" src="%BASE_URL%app-icon.svg" alt="" />
      <div class="splash__name">SimpleCut</div>
      <div class="splash__spin"></div>
    </div>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #111315; color: #F2F3F5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        transition: opacity 0.35s ease;
      }
      html[data-theme='light'] #splash { background: #F4F6F8; color: #242830; }
      html[data-theme='strawberry'] #splash { background: #FFF1F5; color: #4A2F39; }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash__logo { width: 68px; height: 68px; border-radius: 15px; box-shadow: 0 16px 38px rgba(0,0,0,.28); }
      .splash__name { font-size: 20px; font-weight: 700; letter-spacing: 0.3px; }
      .splash__spin {
        width: 30px; height: 30px; margin-top: 6px;
        border: 3px solid #343A43; border-top-color: #D07A7D; border-radius: 50%;
        animation: splashspin 0.8s linear infinite;
      }
      html[data-theme='light'] .splash__spin { border-color: #D6DCE3; border-top-color: #CB6B72; }
      html[data-theme='strawberry'] .splash__spin { border-color: #E4BECB; border-top-color: #DE7388; }
      @keyframes splashspin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
