<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dog.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>간단컷 — 간단한 영상 편집기</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <div class="splash__logo">🐶</div>
      <div class="splash__name">간단컷</div>
      <div class="splash__spin"></div>
    </div>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #FAF7F5; color: #3A3234;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash__logo { font-size: 44px; }
      .splash__name { font-size: 20px; font-weight: 700; letter-spacing: 0.3px; }
      .splash__spin {
        width: 30px; height: 30px; margin-top: 6px;
        border: 3px solid #E8D3D1; border-top-color: #8E5D5E; border-radius: 50%;
        animation: splashspin 0.8s linear infinite;
      }
      @keyframes splashspin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
